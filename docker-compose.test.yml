services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lifepilot_test
      POSTGRES_USER: lifepilot
      POSTGRES_PASSWORD: lifepilot
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifepilot -d lifepilot_test"]
      interval: 5s
      timeout: 3s
      retries: 10
